<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouCam Muse — V2 Prototype</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,'Inter',system-ui,sans-serif;background:#09090B;color:#fff;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;padding:40px 16px;gap:24px;}
  .logo{font-size:11px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.3);text-transform:uppercase;}
  h1{font-size:24px;font-weight:800;letter-spacing:-.4px;text-align:center;}
  .tag{font-size:12px;font-weight:600;color:#A855F7;text-transform:uppercase;letter-spacing:.1em;text-align:center;}
  .card{background:#151519;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px 28px;text-align:center;}
  .qr-box{background:#fff;border-radius:14px;padding:12px;display:inline-block;margin-bottom:16px;}
  .qr-box img,.qr-box canvas{display:block;border-radius:6px;}
  .url-label{font-size:10px;color:rgba(255,255,255,.35);font-family:monospace;word-break:break-all;
             line-height:1.5;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
             border-radius:8px;padding:7px 10px;max-width:220px;margin:0 auto;}
  .status{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 14px;
          font-size:12px;font-weight:600;}
  .status.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:#22c55e;}
  .status.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);color:#f59e0b;}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s ease-in-out infinite;}
  .footer{font-size:12px;color:rgba(255,255,255,.3);text-align:center;line-height:1.9;}
  .footer b{color:rgba(255,255,255,.55);}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
</style>
</head>
<body>
<div class="logo">YouCam Muse</div>
<div>
  <div class="tag">Prototype</div>
  <h1>Scan to Preview</h1>
</div>
<div id="status-wrap"></div>
<div class="card">
  <div class="qr-box" id="qr-box"></div>
  <div class="url-label" id="url-label">Generating…</div>
</div>
<p class="footer">
  <b>iPhone:</b> Open Camera → point at QR code<br>
  Same Wi-Fi as Mac required
</p>
<script>
var TARGET = 'muse-prototype-v2.html';
function setStatus(ok,text){
  document.getElementById('status-wrap').innerHTML='<div class="status '+(ok?'ok':'warn')+'">'+(ok?'<span class="dot"></span>':'⚠')+' '+text+'</div>';
}
function renderQR(url){
  document.getElementById('url-label').textContent=url;
  var el=document.getElementById('qr-box');
  el.innerHTML='';
  if(typeof QRCode!=='undefined'){
    new QRCode(el,{text:url,width:200,height:200,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});
  } else {
    var img=document.createElement('img');
    img.src='https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl='+encodeURIComponent(url)+'&choe=UTF-8';
    img.width=200;img.height=200;img.style.borderRadius='6px';
    el.appendChild(img);
  }
}
function go(host){
  var url=location.protocol+'//'+host+'/'+TARGET;
  setStatus(true,'Network: '+host);
  renderQR(url);
}
(function(){
  if(location.protocol==='file:'){setStatus(false,'Run start-server.sh first');renderQR('http://YOUR-IP:8080/'+TARGET);return;}
  var p=new URLSearchParams(location.search),h=p.get('host');
  if(h){go(h);return;}
  if(location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){go(location.host);return;}
  setStatus(true,'Detecting IP…');
  var done=false;
  function use(h){if(done)return;done=true;go(h);}
  try{
    var pc=new RTCPeerConnection({iceServers:[]});
    pc.createDataChannel('');
    pc.onicecandidate=function(e){
      if(!e||!e.candidate)return;
      var m=/([0-9]{1,3}(?:\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
      if(m&&m[1]!=='127.0.0.1'&&!m[1].startsWith('169.254')){pc.close();use(m[1]+(location.port?':'+location.port:''));}
    };
    pc.createOffer().then(function(o){return pc.setLocalDescription(o);});
  }catch(e){}
  setTimeout(function(){use(location.host);},2000);
})();
</script>
</body>
</html>
